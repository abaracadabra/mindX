# openbdk — self-contained Foundry sub-module of bankoneth.
#
# The openBDK bridge trio (L1Escrow, L2MinterBurner, NativeConverter) + L2Token +
# ValidatorRegistry — forked during Polygon's AggLayer phase, reconciled to the
# bankoneth house toolchain (solc 0.8.24, EVM Cancun, via_ir, OZ v5). Isolated:
# openbdk compiles on its own and is NOT pulled into the root default Ethereum
# build. Reuses the parent's vendored libraries (../lib) rather than duplicating
# them — see remappings.txt. Adds openzeppelin-contracts-upgradeable (v5.0.2,
# version-matched to the non-upgradeable lib) which the bridge stack requires.
#
# (c) 2026 openBDK / Professor Codephreak — MIT.

[profile.default]
src                    = "src"
test                   = "test"
script                 = "script"
out                    = "out"
libs                   = ["../lib"]
auto_detect_remappings = false
solc                   = "0.8.24"
evm_version            = "cancun"
optimizer              = true
optimizer_runs         = 200
via_ir                 = true
fuzz                   = { runs = 256 }
gas_reports            = ["*"]
# vm.writeJson deploy receipts (consumed by agents/deployer FoundryDriver)
fs_permissions         = [{ access = "read-write", path = "./" }]

[profile.ci]
fuzz = { runs = 10_000 }

[rpc_endpoints]
ethereum      = "${ETHEREUM_RPC_URL}"
sepolia       = "${SEPOLIA_RPC_URL}"
polygon_zkevm = "${POLYGON_ZKEVM_RPC_URL}"

[etherscan]
ethereum      = { key = "${ETHERSCAN_API_KEY}" }
polygon_zkevm = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-zkevm.polygonscan.com/api" }
