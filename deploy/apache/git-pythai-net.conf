# git.pythai.net — Apache reverse proxy for the self-hosted Forgejo forge.
#
# Forgejo binds 127.0.0.1:3000 (private); Apache is its only public face. After
# enabling this vhost, run certbot --apache -d git.pythai.net to add the SSL vhost
# (certbot rewrites/creates the :443 block and the http->https redirect).
#
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite git-pythai-net && sudo systemctl reload apache2
#   sudo certbot --apache -d git.pythai.net
<VirtualHost *:80>
    ServerName git.pythai.net

    # Allow large git pushes (packfiles) — gitmind mirror-pushes full history.
    LimitRequestBody 0
    ProxyRequests Off
    ProxyPreserveHost On

    # Pass the real client + scheme so Forgejo builds correct absolute URLs.
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3000/ timeout=600
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/git.pythai.net-error.log
    CustomLog ${APACHE_LOG_DIR}/git.pythai.net-access.log combined
</VirtualHost>
