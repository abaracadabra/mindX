# DELTAVERSE Keeper — Prometheus Configuration
#
# Prometheus scrapes metrics endpoints on a schedule and stores them
# as time series. The keepers in their current form do not yet expose
# a /metrics HTTP endpoint, but the infrastructure is wired here so
# that when that endpoint is added (a small future enhancement), the
# metrics pipeline works without additional configuration changes.
#
# This file also scrapes Prometheus itself so that you can see its
# own health in Grafana, which is useful during debugging.

global:
  # How often to scrape each target. 15 seconds is the de facto
  # Prometheus default and balances freshness against storage cost.
  scrape_interval: 15s

  # How often to evaluate alerting rules. Matches scrape_interval
  # so that rules see every scrape result.
  evaluation_interval: 15s

  # Labels attached to every metric before storage. external_labels
  # are what distinguishes data from multiple clusters or environments
  # in a federated Prometheus setup.
  external_labels:
    cluster: deltaverse-keepers
    environment: production

# Alerting rules go in separate files and are loaded here. This file
# is a placeholder — in a real deployment you would add rules for
# things like "keeper has not emitted a log in 5 minutes" or "oracle
# composite has not updated in 30 minutes".
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # Scrape Prometheus itself so that its own health is observable.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the keeper bots. The keepers do not yet expose /metrics,
  # but the configuration is here for when they do. Each keeper
  # container is a separate target so that metrics can be attributed
  # to the specific bot that produced them.
  - job_name: 'keeper-pyth'
    static_configs:
      - targets: ['keeper-pyth:9100']
        labels:
          keeper_type: pyth

  - job_name: 'keeper-subindex'
    static_configs:
      - targets: ['keeper-subindex:9100']
        labels:
          keeper_type: subindex

  - job_name: 'keeper-fees'
    static_configs:
      - targets: ['keeper-fees:9100']
        labels:
          keeper_type: fees

  - job_name: 'keeper-liquidator'
    static_configs:
      - targets: ['keeper-liquidator:9100']
        labels:
          keeper_type: liquidator
